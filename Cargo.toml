[package]
name = "linklane"
version = "0.4.0"
edition = "2024"
description = "Route links to browser identities with explainable rules"
license = "GPL-3.0-only"
repository = "https://github.com/pluveto/linklane"
rust-version = "1.96"
default-run = "linklane"

[dependencies]
anyhow = "1"
dirs = "6"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "accessibility", "unstable-winit-030"] }
time = { version = "0.3", features = ["serde"] }
tempfile = "3"
url = { version = "2", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png"] }
regex = "1"
globset = "0.4"
configparser = "3"
percent-encoding = "2"
toml = "1.1"
toml_edit = "0.25"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
arboard = { version = "3.7", default-features = false }

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
lto = "thin"
strip = true
